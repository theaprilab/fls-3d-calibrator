[project]
name = "sonar-calibrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "open3d>=0.19.0",
    "opencv-python>=5.0.0.93",
    "pathlib>=1.0.1",
    "ruff>=0.16.3",
]
[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["sonar-calibrator"]
include = ["*.py","*.toml",]
